<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calenstine">
<meta name="theme-color" content="#f7f5f2">
<title>Calenstine</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root {
  --bg: #f7f5f2;
  --ink: #2f2b3a;
  --muted: #8a8597;
  --accent: #8b7fd6;
  --accent-soft: #ece8fb;
  --line: #e4e0ea;
  --panel: #ffffff;
  --danger: #d9534f;
  --ok: #3aa66a;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body {
  margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
body {
  display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Barre du haut ---------- */
#topbar { display: flex; align-items: center; gap: 10px; padding: 6px 12px; min-height: 54px; flex-wrap: wrap; }
.nav-group, .right-group { display: flex; align-items: center; gap: 4px; }
.nav-group { flex: 1 1 auto; min-width: 0; }
.right-group { margin-left: auto; }
#title { font-size: 19px; font-weight: 700; margin: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.icon-btn { width: 40px; height: 40px; border: 0; background: transparent; border-radius: 12px; display: grid; place-items: center; flex: none; }
.icon-btn:active { background: var(--accent-soft); }
.icon-btn svg { width: 24px; height: 24px; }
.pill { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 14px; font-size: 15px; white-space: nowrap; }
.pill:active { background: var(--accent-soft); }
.seg { display: flex; background: #ebe8f0; border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 9px; font-size: 15px; font-weight: 500; color: #5b5668; }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); font-weight: 650; }
.chip { font-size: 12.5px; padding: 4px 9px; border-radius: 999px; background: #ebe8f0; color: #5b5668; white-space: nowrap; }
.chip.ok { background: #e3f4ea; color: #2d7a50; }
.chip.err { background: #fde2e1; color: #a32f2b; font-weight: 600; }
.chip.warn { background: #fff1d6; color: #8a5a00; }

/* ---------- Barre d'outils ---------- */
#toolbar { display: flex; align-items: center; gap: 8px; padding: 4px 10px 8px; overflow-x: auto; scrollbar-width: none; flex: none; }
#toolbar::-webkit-scrollbar { display: none; }
#toolbar .group { display: flex; align-items: center; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 3px; flex: none; }
#toolbar .group > button { border: 0; background: transparent; border-radius: 10px; height: 40px; min-width: 40px; padding: 0 8px; display: flex; align-items: center; gap: 6px; font-size: 13.5px; }
#toolbar .group > button svg { width: 22px; height: 22px; }
#toolbar .group > button span { display: none; }
#toolbar .group > button.on { background: var(--accent-soft); color: #5b4bb7; }
#toolbar .group > button:disabled { opacity: .35; }
#toolbar .group > button.danger { color: var(--danger); }
#tools button.on span { display: inline; }
#toolbar #colors > button.sw { width: 30px; min-width: 30px; height: 30px; border-radius: 50%; padding: 0; margin: 0 2px; background: var(--c); border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); }
#toolbar #colors > button.sw.on { box-shadow: 0 0 0 2.5px var(--accent); }
#colors.dim { opacity: .35; pointer-events: none; }
#sizes i { display: block; width: var(--d); height: var(--d); border-radius: 50%; background: currentColor; }
#sizes.dim { opacity: .35; pointer-events: none; }
#ctx button { font-size: 14px; font-weight: 600; }
#ctx.is-text .img-only, #ctx.is-img .txt-only { display: none; }
@media (min-width: 1360px) { #toolbar .group > button span { display: inline; } }

/* ---------- Zone de dessin ---------- */
#stage {
  position: relative; flex: 1; overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#paper {
  position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #fff;
  border-radius: 16px; box-shadow: 0 3px 18px rgba(50, 35, 110, .13);
}
#grid { position: absolute; inset: 0; width: 100%; height: 100%; display: block; stroke: none; fill: initial; stroke-width: initial; }
#grid .nav { pointer-events: none; }
.mode-move #grid .nav { pointer-events: auto; cursor: pointer; }
#objects { position: absolute; inset: 0; pointer-events: none; }
.obj { pointer-events: auto; }
.mode-draw .obj { pointer-events: none; }
#stage canvas { position: absolute; left: 0; top: 0; pointer-events: none; }
#cv-hl { opacity: .42; mix-blend-mode: multiply; }
#cv-live.hl { opacity: .42; mix-blend-mode: multiply; }

.obj { position: absolute; touch-action: none; }
.obj-text {
  white-space: pre-wrap; word-break: break-word; line-height: 1.25; padding: 4px 6px; min-height: 1.6em;
  outline: none; border-radius: 6px; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
}
.mode-text .obj-text { -webkit-user-select: text; user-select: text; cursor: text; background: rgba(139,127,214,.06); box-shadow: inset 0 0 0 1px rgba(139,127,214,.35); }
.mode-text .obj-text:focus { background: rgba(139,127,214,.10); box-shadow: inset 0 0 0 2px var(--accent); }
.mode-move .obj { cursor: grab; }
.obj img { width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; object-fit: contain; }
.obj-image img { border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.18); object-fit: cover; }
.obj.missing { background: repeating-linear-gradient(45deg, #f1eff5, #f1eff5 10px, #e7e3ee 10px, #e7e3ee 20px); border-radius: 6px; }
.obj.sel { outline: 3px dashed var(--accent); outline-offset: 4px; }
.handle { position: absolute; right: -18px; bottom: -18px; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); border: 4px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.25); display: none; }
.mode-move .obj.sel .handle { display: block; }

/* ---------- Bandeaux & toast ---------- */
#banners { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 20; width: min(640px, calc(100% - 24px)); pointer-events: none; }
.banner { pointer-events: auto; background: #2f2b3a; color: #fff; border-radius: 14px; padding: 11px 12px 11px 16px; display: flex; align-items: center; gap: 10px; font-size: 14.5px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.banner.err { background: #a32f2b; }
.banner p { margin: 0; flex: 1; line-height: 1.35; }
.banner button { border: 0; background: rgba(255,255,255,.16); color: #fff; border-radius: 9px; padding: 7px 11px; font-weight: 600; font-size: 14px; white-space: nowrap; }
#toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top)); transform: translate(-50%, -20px); background: #2f2b3a; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14.5px; opacity: 0; transition: .25s; z-index: 30; pointer-events: none; max-width: 90vw; text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Fenêtres ---------- */
dialog { border: 0; border-radius: 20px; padding: 0; width: min(640px, calc(100vw - 28px)); max-height: calc(100dvh - 60px); background: var(--bg); color: var(--ink); box-shadow: 0 20px 60px rgba(30, 20, 70, .3); -webkit-user-select: text; user-select: text; }
dialog::backdrop { background: rgba(30, 25, 50, .35); }
dialog[open] { display: flex; flex-direction: column; }
.dlg-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; position: sticky; top: 0; background: var(--bg); }
.dlg-head h2 { margin: 0; font-size: 20px; flex: 1; }
#dlg-menu #menu-body, #dlg-search #search-results, #dlg-stickers #st-grid { overflow-y: auto; }
#menu-body { padding: 0 16px 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
.card h3 { margin: 0 0 8px; font-size: 16px; }
.card p { margin: 6px 0; line-height: 1.4; font-size: 14.5px; }
.row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.row.wrap { flex-wrap: wrap; padding: 0 16px; }
.btn { border: 0; background: var(--accent); color: #fff; border-radius: 11px; padding: 10px 14px; font-weight: 600; font-size: 15px; }
.btn.ghost { background: #ebe8f0; color: var(--ink); }
.btn.danger { background: #fde2e1; color: #a32f2b; }
.btn:disabled { opacity: .5; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14.5px; }
.kv b { font-weight: 600; }
.yes { color: var(--ok); font-weight: 600; }
.no { color: var(--danger); font-weight: 600; }
label.field { display: block; margin-top: 8px; font-size: 13.5px; color: var(--muted); }
label.field input { display: block; width: 100%; margin-top: 4px; }
input[type=text], input[type=url], input[type=email], input[type=password], input[type=search] {
  font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; background: #fff; color: var(--ink); width: 100%;
}
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 14.5px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }

#dlg-search .dlg-head input { flex: 1; }
#search-info { padding: 0 18px; margin: 0 0 6px; }
#search-results { list-style: none; margin: 0; padding: 0 12px 16px; }
#search-results li button { width: 100%; text-align: left; border: 0; background: var(--panel); border-radius: 12px; padding: 10px 14px; margin-bottom: 6px; display: block; }
#search-results li button:active { background: var(--accent-soft); }
#search-results .r-page { font-size: 12.5px; color: var(--muted); }
#search-results .r-text { font-size: 16px; margin-top: 2px; }
#search-results mark { background: #ffe9a6; color: inherit; border-radius: 3px; }

#st-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; padding: 8px 16px 18px; }
#st-grid .st { position: relative; aspect-ratio: 1; background: #fff; border: 1px solid var(--line); border-radius: 14px; display: grid; place-items: center; padding: 8px; }
#st-grid .st img { max-width: 100%; max-height: 100%; }
#st-grid .st .x { position: absolute; top: -6px; right: -6px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--danger); color: #fff; font-weight: 700; display: none; }
#st-grid.editing .st .x { display: block; }
#st-grid .empty { grid-column: 1 / -1; color: var(--muted); font-size: 14.5px; }

@media (max-width: 760px) {
  .seg button { padding: 6px 9px; font-size: 14px; }
  #title { font-size: 17px; }
}

</style>

  <div id="st-grid"></div>

<input type="file" id="file-image" accept="image/*" hidden>

function highlight(text, q) {
  const terms = norm(q).split(" ").filter(Boolean);
  const n2 = norm(text);
  let out = esc(text);
  if (n2.length === text.length) {
    const ranges = [];
    for (const t2 of terms) {
      let i2 = n2.indexOf(t2);
      while (i2 >= 0) {
        ranges.push([i2, i2 + t2.length]);
        i2 = n2.indexOf(t2, i2 + t2.length);
      }
    }
    ranges.sort((a2, b2) => b2[0] - a2[0]);
    let s2 = text;
    const parts = [];
    let end = s2.length;
    for (const [a2, b2] of ranges) {
      if (b2 > end) continue;
      parts.unshift(esc(s2.slice(b2, end)));
      parts.unshift(`<mark>${esc(s2.slice(a2, b2))}</mark>`);
      end = a2;
    }
    parts.unshift(esc(s2.slice(0, end)));
    out = parts.join("");
  }
  return out;
}
